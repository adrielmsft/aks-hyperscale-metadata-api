name: Build, test, and HTTP E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore MetadataApi.slnx

      - name: Build
        run: dotnet build MetadataApi.slnx --configuration Release --no-restore

      - name: Unit and SQLite integration tests with coverage
        run: >-
          dotnet test tests/MetadataApi.Tests/MetadataApi.Tests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit-integration.trx"
          --results-directory artifacts/unit-integration

      - name: Generate ephemeral E2E API key
        id: api-key
        shell: bash
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Start OpenTelemetry collector
        run: |
          mkdir -p artifacts/otel
          chmod 777 artifacts/otel
          docker run -d --name metadata-otel --memory 128m \
            -p 127.0.0.1:4317:4317 \
            -v "$PWD/.github/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$PWD/artifacts/otel:/data" \
            otel/opentelemetry-collector-contrib:0.147.0
          for attempt in $(seq 1 30); do
            # gRPC is HTTP/2-only; TCP availability is sufficient here. The E2E verifies delivery.
            if (echo > /dev/tcp/127.0.0.1/4317) 2>/dev/null; then break; fi
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/4317) 2>/dev/null
          test "$(docker inspect -f '{{.State.Running}}' metadata-otel)" = true

      - name: Real HTTP E2E (migrate, start Kestrel, test, restart, clean up)
        env:
          Authentication__ApiKey: ${{ steps.api-key.outputs.key }}
          OTEL_SMOKE_EXPORT_FILE: ${{ github.workspace }}/artifacts/otel/telemetry.json
          OTEL_SMOKE_ENDPOINT: http://127.0.0.1:4317
        run: >-
          dotnet test tests/MetadataApi.E2E.Tests/MetadataApi.E2E.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=e2e.trx"
          --results-directory artifacts/e2e-results

      - name: Stop OpenTelemetry collector
        if: always()
        run: |
          mkdir -p artifacts/otel
          docker logs metadata-otel > artifacts/otel/collector.log 2>&1 || true
          docker stop --time 10 metadata-otel || true
          docker rm metadata-otel || true

      - name: Report coverage
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/unit-integration)) {
            throw "The unit/integration results directory was not generated."
          }
          $report = Get-ChildItem artifacts/unit-integration -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $report) {
            throw "The unit/integration coverage report was not generated."
          }
          [xml]$coverage = Get-Content -LiteralPath $report.FullName -Raw
          $lines = [math]::Round(100 * [double]$coverage.coverage.'line-rate', 2)
          $branches = [math]::Round(100 * [double]$coverage.coverage.'branch-rate', 2)
          @"
          ## Unit and integration coverage
          | Metric | Coverage |
          | --- | --- |
          | Lines | $lines% |
          | Branches | $branches% |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload test results, coverage, and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/unit-integration
            artifacts/e2e-results
            artifacts/e2e
            artifacts/otel
          if-no-files-found: warn
          retention-days: 7
